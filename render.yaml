# Render Blueprint for Aroless (TanStack Start + Nitro persistent Node service).
# Create this from Render Dashboard → New → Blueprint, then add secrets in the
# service Environment tab. No secret values belong in this file.
#
# ⚠️ ÜCRETSİZ PLAN UYGUN DEĞİL — ve Render zorunlu da değil.
#   * Ağır iş için Render'a HİÇ ihtiyaç yok: Vercel Hobby fonksiyon tavanı 300 sn,
#     hat 260 sn'de biter, iş uygulamanın kendi `/api/worker` ucuna QStash ile
#     yayınlanır (`DISCOVERY_WORKER_URL` boş kalır). Ücretsiz ve soğuk başlangıç yok.
#   * Render ücretsiz Web Service 15 dk hareketsizlikte uyur, geri açılması ~1 dk
#     sürer (bu süre hat bütçesinden düşülür → kaliteden yer), "harici API/DB
#     trafiği" nedeniyle askıya alınabilir ve aylık 750 instance saat sınırı vardır.
#   * Bu blueprint'i yalnızca ÜCRETLİ bir instance ile kalıcı süreç istiyorsan kullan.
#   * 504'ü sunucusuz ortamda yapısal olarak kapatan kesme noktası `src/server.ts`
#     içindeki `requestDeadlineMs()`'tir (Hobby'de 292 sn → 503 + Retry-After).
#     Render kalıcı bir süreç olduğu için orada bilinçli olarak devre dışıdır.
#
# Bu dosya yalnızca ANAHTAR ADLARINI listeler. Sadece kullandığın anahtarları
# doldur; boş bırakılanlar devre dışı kalır (Render Blueprint oluştururken
# değerleri atlayabilirsin, sonradan Dashboard → Environment'tan ekleyebilirsin).
#
# 22-key mesh: kod `src/lib/ai-keys.server.ts` her sağlayıcı için BASE adı ve
# _1.._8 slotlarını tarar — hangi soneki kullanırsan otomatik bulunur.
#
# Find Winner TEK BİR SÖZ verir: uçtan uca en fazla 280 sn
# (`DISCOVERY_END_TO_END_MS`, `discovery-jobs.server.ts`). Hattın kendi bütçesi
# 260 sn'dir (280 − 20 sn dönüş payı); platform ne verirse versin hat kendini bu
# sayıya sığdırır ve aşama pencerelerini içeride böler (`discoveryStagePlan`).
#
# Üç önemli davranış:
#   1. ÖN SONUÇ: canlı doğrulanmış ürünler AI Konsey karneye başlamadan önce
#      `searches.result` alanına yazılır (`status` = `processing` kalır). İstemci
#      ilk yoklamada ürünleri gösterir, yoklamaya devam eder ve nihai sonuç
#      geldiğinde üzerine yazar → kullanıcı ~1,5-2 dk'da ürün görür.
#   2. KARNE ÜST SINIRI: konsey karne turu en iyi 3 ürünle sınırlıdır; döngü tüm
#      ürünleri gezip bütçenin son saniyesine kadar yakmaz.
#   3. QStash publish timeout'u `qstashTimeoutSeconds()` ile seçilir: Render
#      algılanınca 890 sn, Vercel'de fonksiyon sınırı − 2 sn (Hobby 300 sn → 298 sn).
#
# Vercel'de (QSTASH_TOKEN + JOB_WORKER_SECRET TANIMLIYSA) iş `/api/worker`'a
# yayınlanır ve arka planda koşar; hedef, `DISCOVERY_WORKER_URL` boşsa uygulamanın
# KENDİ origin'idir (yani ayrı servis gerekmez). Bu iki anahtardan biri eksikse
# `inline` moda düşer ve ağır hat isteğin İÇİNDE koşar. Doğrulama: `/health` →
# `workflow.dispatch` = `qstash` olmalı.
#
# Zaman sözü: bütçe kuyruğa alınma anından ölçülür (`remainingWorkerBudgetMs`),
# yani QStash teslimi + soğuk başlangıç süresi hattan düşülür ve "tıkla → sonuç"
# her koşulda ≤ 280 sn kalır. İş kilidi `jobLeaseSeconds()` = 310 sn'dir; öldürülen
# bir iş böylece QStash tekrar denemesinde devralınabilir (eskiden 900 sn'lik kilit
# yüzünden kayıt sonsuza kadar `processing` kalıyordu).
#
# 504 KORUMASI (bu servisin en önemli ayarı): Render bir **kalıcı** Node servisi
# çalıştırır, yani istek yanıtlandıktan sonra süreç yaşamaya devam eder. Ağır
# işler (ürün bulucu hattı, AI konsey, saatlik taramalar) bu yüzden istek içinde
# beklenmez:
#   * `/health` → platform, istek bütçesi ve arka plan kuyruğu durumunu gösterir.
#   * Kalıcı süreçte QStash OLMADAN da işler arka planda koşar
#     (`src/lib/job-runner.server.ts`); istek anında `jobId` döner, istemci yoklar.
#   * Herkese açık AI uçları `ready | stale | warming` desenini kullanır: bayat
#     veriyi anında döner, tazesini arka planda üretir (bkz. `swr-cache.server.ts`).
#   * Tek bir isteğin üst sınırı `REQUEST_BUDGET_MS` (varsayılan 45 sn) — proxy'nin
#     isteği kesmesi beklenmeden hızlı bir "hazırlanıyor" yanıtına dönülür.
services:
  - type: web
    name: aroless
    runtime: node
    plan: 1c-2g
    region: frankfurt
    # Push'lar `aroless-repo` dalına gider; otomatik deploy'un onu izlediğinden
    # emin olmak için açıkça sabitlendi.
    branch: aroless-repo
    # Bellek tavanı: nitro SSR fazı 2 GB'lık planda sınıra yaklaşıyor. V8'e
    # açık bir tavan vererek kernel OOM killer'ının build'i öldürmesini
    # engelliyoruz (tavan aşılırsa yine anlaşılır bir heap hatası alırız).
    buildCommand: npm install && NODE_OPTIONS=--max-old-space-size=1536 npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    # Deploy sırasında Render önce SIGTERM yollar: arka planda koşan uzun işler
    # (ürün bulucu taraması) yarıda kesilmesin diye kapanışa 90 sn tanınıyor.
    maxShutdownDelaySeconds: 90
    numInstances: 1
    envVars:
      # --- Runtime (sabit değerler) ---
      - key: NODE_VERSION
        value: 20.19.0
      - key: NITRO_PRESET
        value: render_com
      - key: NITRO_HOST
        value: 0.0.0.0
      - key: NODE_ENV
        value: production
      - key: QSTASH_REGION
        value: eu
      # --- 504 koruması: istek bütçeleri ve arka plan işleri ---
      # Tek bir etkileşimli isteğin üst sınırı (ms). Aşılırsa istek hızlı bir
      # "hazırlanıyor" yanıtına döner; proxy'nin 504 üretmesi beklenmez.
      - key: REQUEST_BUDGET_MS
        value: "45000"
      # Aynı anda arka planda koşacak iş sayısı (tek CPU'da SSR'ı boğmamak için).
      - key: BACKGROUND_JOB_CONCURRENCY
        value: "2"
      # Tek bir arka plan işinin sert üst sınırı (ms): 15 dk.
      - key: BACKGROUND_JOB_TIMEOUT_MS
        value: "900000"
      # Önbellek soğukken istek içinde beklenecek en uzun süre (ms).
      - key: WARM_WAIT_MS
        value: "20000"
      # --- App origin ---
      # Custom domain (aroless.tech) bağlanmadan Render'ın geçici adresini yazma:
      # QStash worker adresi ve OAuth redirect'leri bu değerden üretilir.
      - key: APP_URL
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: VITE_APP_URL
        sync: false
      # --- Frontend (build sırasında gömülür, public) ---
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: VITE_TURNSTILE_SITE_KEY
        sync: false
      - key: VITE_API_BASE_URL
        sync: false
      # --- Supabase ---
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # --- Kuyruk / işçi ---
      - key: QSTASH_TOKEN
        sync: false
      - key: QSTASH_URL
        sync: false
      - key: JOB_WORKER_SECRET
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      # Hibrit kurulum: tetikleyici Vercel'de kalırken worker Render'daysa buraya
      # worker'ın public adresini yaz (ör. https://aroless.tech/api/worker).
      # Boşsa worker adresi isteğin kendi origin'inden türetilir.
      - key: DISCOVERY_WORKER_URL
        sync: false
      # Ağır işlerin (AI Konsey vb.) uzak worker adresi. Vercel tetikleyicisi
      # işi bu servise QStash ile yollar; servis işi arka planda koşturur ve
      # istek anında döner → 504 yok. Yolu `/api/jobs` olarak kullanılır
      # (ör. https://aroless.onrender.com). Render'da çalışıyorsan bu değişken
      # GEREKMEZ: işler süreç içi kuyrukta koşar.
      - key: WORKER_URL
        sync: false
      # QStash `Upstash-Timeout` değerini elle sabitlemek için (15..900 sn).
      # Boşsa platform otomatik seçilir: Render 890 sn, Vercel 298 sn.
      - key: QSTASH_TIMEOUT_SECONDS
        sync: false
      # --- AI Gateway (opsiyonel, öncelikli) ---
      - key: AI_GATEWAY_URL
        sync: false
      - key: AI_GATEWAY_API_KEY
        sync: false
      - key: AI_GATEWAY_MODELS
        sync: false
      - key: LOVABLE_API_KEY
        sync: false
